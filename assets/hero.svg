<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="what-we-build">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="0.5" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <style>
      .bg { fill: #ffffff; }
      .word { font: 700 128px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -4px; }
      @media (prefers-color-scheme: dark) { .bg { fill: #0d1117; } }
    </style>
  </defs>
  <rect class="bg" width="1200" height="300" rx="24"/>
  <text class="word" x="600" y="190" text-anchor="middle" fill="url(#ink)">what-we-build</text>
</svg>
